name: Build SPK Release

on:
  workflow_dispatch:
    inputs:
      netbird_version:
        description: "Upstream NetBird version to package (leave blank for the repository VERSION)"
        required: false
        default: ""
      build_suffix:
        description: "Numeric SPK revision (e.g. 1, 2). Leave blank to use REVISION."
        required: false
        default: ""
      publish_release:
        description: "Create a GitHub Release with the SPK attached"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - synology_arch: x86_64
            netbird_arch: amd64
          - synology_arch: aarch64
            netbird_arch: arm64
    outputs:
      pkg: ${{ steps.ver.outputs.pkg }}
      upstream: ${{ steps.ver.outputs.upstream }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Test package scripts
        run: make test

      - name: Resolve versions
        id: ver
        env:
          NETBIRD_VERSION: ${{ inputs.netbird_version }}
          BUILD_SUFFIX: ${{ inputs.build_suffix }}
        run: |
          set -euo pipefail
          if [ -n "$NETBIRD_VERSION" ]; then
            upstream="$NETBIRD_VERSION"
          else
            upstream=$(cat VERSION)
          fi
          suffix="${BUILD_SUFFIX:-$(cat REVISION)}"
          if [ -n "$suffix" ]; then
            pkg="${upstream}-${suffix}"
          else
            pkg="$upstream"
          fi
          [[ "$upstream" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$suffix" =~ ^[1-9][0-9]*$ ]] || exit 1
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "pkg=$pkg"           >> "$GITHUB_OUTPUT"
          echo "tag=v$pkg"          >> "$GITHUB_OUTPUT"
          echo "Upstream NetBird: v$upstream"
          echo "Package version:  $pkg (${{ matrix.synology_arch }})"

      - name: Download NetBird binary (upstream version)
        run: |
          make download \
            CORE_VERSION=${{ steps.ver.outputs.upstream }} \
            SYNOLOGY_ARCH=${{ matrix.synology_arch }} \
            NETBIRD_ARCH=${{ matrix.netbird_arch }}

      - name: Build SPK (package version)
        run: |
          make package \
            VERSION=${{ steps.ver.outputs.pkg }} \
            CORE_VERSION=${{ steps.ver.outputs.upstream }} \
            UPDATE_REPOSITORY=${{ github.repository }} \
            SYNOLOGY_ARCH=${{ matrix.synology_arch }} \
            NETBIRD_ARCH=${{ matrix.netbird_arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: netbird_${{ steps.ver.outputs.pkg }}_synology_${{ matrix.netbird_arch }}
          path: netbird_${{ steps.ver.outputs.pkg }}_synology_${{ matrix.netbird_arch }}.spk
          if-no-files-found: error

  publish-release:
    needs: build
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all SPK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: netbird_*_synology_*
          merge-multiple: true

      - name: Publish GitHub Release (all arches)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          UPSTREAM: ${{ needs.build.outputs.upstream }}
        run: |
          set -euo pipefail
          ls -la netbird_*_synology_*.spk
          if gh release view "$TAG" >/dev/null 2>&1; then
            for f in netbird_*_synology_*.spk; do
              gh release upload "$TAG" "$f" --clobber
            done
          else
            gh release create "$TAG" \
              --title "${TAG}_synology" \
              --notes-file docs/releases/${TAG}.md \
              netbird_*_synology_*.spk
          fi

  deploy-catalog:
    needs: [build, publish-release]
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Download all SPK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: netbird_*_synology_*
          merge-multiple: true

      - name: Build _site (catalog + landing page)
        env:
          PKG_VERSION: ${{ needs.build.outputs.pkg }}
          UPSTREAM_VERSION: ${{ needs.build.outputs.upstream }}
          TAG: ${{ needs.build.outputs.tag }}
          REPO: ${{ github.repository }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          python3 scripts/build-docsite.py --assets . --output _site --repository "$REPO" --base-url "$BASE_URL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
